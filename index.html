<!DOCTYPE html>
<html>
<head>
  <style>
    .box-btn {
      padding: 12px 20px;
      border: 2px solid black;
      background: white;
      font-size: 16px;
      cursor: pointer;
      font-family: sans-serif;
    }
  </style>
</head>

<body>

<button class="box-btn" id="myBtn">Download Project</button>

<!-- JSON DATA -->
<script id="projectData" type="application/json">
{
  "formatVersion": 1,
  "engine": "16Coding",
  "projectName": "Project",
  "author": "Michael",
  "assets": {
    "sprites": ["assets/sprite1.svg"],
    "sounds": ["assets/sound1.wav"]
    "blocks": [none]
// Workspace JSON
let workspaceJSON = {
  blocks: {}
};

// Update a block's data inside the JSON
function updateBlockJSON(blockId, data) {
  workspaceJSON.blocks[blockId] = {
    ...workspaceJSON.blocks[blockId],
    ...data
  };

  console.log("Updated JSON:", JSON.stringify(workspaceJSON, null, 2));
}

// Fired whenever a block is dragged
function onBlockDrag(block) {
  updateBlockJSON(block.id, {
    position: {
      x: block.x,
      y: block.y
    }
  });
}

// Fired whenever a block snaps to another block
function onBlockSnap(block, targetBlock) {
  updateBlockJSON(block.id, {
    snappedTo: targetBlock.id,
    connectionType: block.connectionType
  });
}
  },
  "settings": {
    "resolution": "1920x1080",
    "background": "#000000"
  }
}
</script>

<script>
document.getElementById("myBtn").addEventListener("click", function() {

  // 1. Get JSON text
  const raw = document.getElementById("projectData").textContent;

  // 2. Create a Blob (file-like object)
  const blob = new Blob([raw], { type: "application/json" });

  // 3. Create a temporary download link
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "project.16coding"; // file name

  // 4. Trigger download
  a.click();

  // 5. Clean up
  URL.revokeObjectURL(url);
});
</script>

<label class="box-btn">
  Import Project
  <input type="file" id="filePicker" accept=".16coding.json,.sb3,.pmp,.dino,application/json" style="display:none;">
</label>

</body>
</html>
